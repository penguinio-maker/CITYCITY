<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tiny Living City</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Three.js is the only dependency (loaded from a CDN via import map). -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="loader"><div class="spinner"></div><span>Building the city…</span></div>

  <header class="card title-card ui">
    <div class="title-row">
      <span id="phaseIcon" class="phase-icon day"></span>
      <div>
        <h1>Tiny Living City</h1>
        <div class="sub"><span id="clock">16:18</span><span class="dot">•</span><span id="phase">Afternoon</span></div>
      </div>
    </div>
    <input id="timeSlider" type="range" min="0" max="23.99" step="0.01" value="16.3" aria-label="Time of day" />
  </header>

  <nav class="card controls ui" aria-label="Simulation controls">
    <button id="btnPlay" class="icon-btn" title="Pause (Space)" aria-label="Pause">
      <svg class="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>
      <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.2-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
    </button>
    <div class="seg" role="group" aria-label="Speed">
      <button data-speed="1" title="1x (key 1)">1x</button>
      <button data-speed="10" title="10x (key 2)">10x</button>
      <button data-speed="100" title="100x (key 3)">100x</button>
    </div>
    <span class="sep"></span>
    <button id="btnWeather" class="pill" title="Toggle weather (R)">
      <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><g stroke-width="2" stroke-linecap="round"><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></g></svg>
      <svg class="i-rain" viewBox="0 0 24 24"><path d="M7 15a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 17.8 7.6 3.8 3.8 0 0 1 17.5 15H7z"/><g stroke-width="1.8" stroke-linecap="round"><path d="M8.5 17.5l-1 2.5M12.5 17.5l-1 2.5M16.5 17.5l-1 2.5"/></g></svg>
      <span class="label">Clear</span>
    </button>
    <button id="btnCine" class="pill" title="Cinematic camera (C)">
      <svg viewBox="0 0 24 24"><rect x="3" y="6.5" width="12.5" height="11" rx="2.2"/><path d="M16.5 10.5l4.5-2.6v8.2l-4.5-2.6z"/></svg>
      <span class="label">Cinematic</span>
    </button>
    <button id="btnHome" class="icon-btn" title="Reset camera (0)" aria-label="Reset camera">
      <svg viewBox="0 0 24 24"><path d="M12 3.2 3 10.4V20a1 1 0 0 0 1 1h5.2v-6h5.6v6H20a1 1 0 0 0 1-1v-9.6z"/></svg>
    </button>
  </nav>

  <div class="hint ui">Drag to orbit · Right-drag to pan · Scroll to zoom · <b>H</b> hides UI</div>
  <div id="stats"><span id="fps">– fps</span></div>

  <noscript><p class="noscript">Tiny Living City needs JavaScript.</p></noscript>
  <script>
    function cityFail(msg) {
      if (document.body.classList.contains('ready')) return;
      document.querySelector('#loader span').textContent = msg;
      document.querySelector('#loader .spinner').style.display = 'none';
    }
    window.addEventListener('error', (e) => cityFail('Could not start: ' + (e.message || 'load error')));
    if (location.protocol === 'file:') cityFail('Please serve this folder over http (e.g. "npx serve" or "python -m http.server") — browsers block ES modules on file://');
    setTimeout(() => cityFail('Still loading… Three.js is fetched from cdn.jsdelivr.net — check your internet connection.'), 15000);
  </script>
  <script type="module" src="main.js" onerror="cityFail('Could not load the scripts (Three.js is loaded from cdn.jsdelivr.net). Check your connection and serve over http://')"></script>
</body>
</html>
